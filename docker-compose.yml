# Copy .env.example to .env first. Inside the compose network services reach each other by service name.
x-django-env: &django-env
  env_file:
    - .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tunisovereign_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *django-env
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  grpc:
    <<: *django-env
    build: .
    command: python -m grpc_service.server
    ports:
      - "50051:50051"
    depends_on:
      web:
        condition: service_started

  # One-shot telemetry stream:  docker compose --profile sim run --rm simulator
  simulator:
    <<: *django-env
    build: .
    profiles: ["sim"]
    command: python -m simulator.tunisian_simulator --mode grpc --hours 24
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SIMULATOR_GRPC_TARGET: grpc:50051
      SIMULATOR_API_URL: http://web:8000
    depends_on:
      - grpc

  # ----- Weeks 2-4 services, kept from the starter template (not used or verified in Week 1) -----
  anvil-blockchain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "2"]
    ports:
      - "8545:8545"

  dashboard:
    build:
      context: .
      args:
        INSTALL_FULL: "1"
    command: streamlit run dashboard/streamlit_command_center.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - db
      - redis
      - anvil-blockchain

  n8n-boundary:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Africa/Tunis
    ports:
      - "5678:5678"
    volumes:
      - ./workflows:/home/node/.n8n/workflows

volumes:
  pgdata:
